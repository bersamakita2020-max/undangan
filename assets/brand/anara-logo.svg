<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Anara Studio">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e9ebee"/><stop offset=".7" stop-color="#b9bec6"/><stop offset="1" stop-color="#f4f5f7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e0a0f"/><stop offset=".35" stop-color="#d7141a"/><stop offset=".6" stop-color="#ff4a4f"/><stop offset="1" stop-color="#a50d12"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a2a2e" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#sh)">
