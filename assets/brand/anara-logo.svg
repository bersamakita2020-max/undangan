    <path fill="url(#gloss)" opacity=".7" d="M60 156 C 104 132, 160 136, 200 138 C 236 139, 262 128, 284 106 C 262 132, 232 146, 198 147 C 150 148, 104 140, 60 156 Z"/>
    <path fill="none" stroke="#ffb3b5" stroke-width="1" opacity=".6" d="M70 158 C 120 140, 170 146, 210 146"/>
  </g>
  <text x="160" y="272" text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="24" letter-spacing="7" fill="#9aa0a8">ANARA STUDIO</text>
</svg>
